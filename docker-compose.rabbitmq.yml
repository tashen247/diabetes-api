services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: fundus-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI, guest/guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq-data:
